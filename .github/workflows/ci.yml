name: Validate store
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:bff
      - run: npm run build
      - run: npm run build:bff
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: npm run test:e2e
      - name: Non-demo browser flows
        run: npm run test:e2e:live
      - name: Validate auxiliary Cloudflare Workers
        run: |
          npx wrangler deploy --dry-run --config wrangler.images.toml --outdir /tmp/bapi-images
          npx wrangler deploy --dry-run --config wrangler.maintenance.toml --outdir /tmp/bapi-maintenance
